<!-- Every variant at seed 0, as the brand assets cut it. -->
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="band" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">band</figcaption></figure>
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="field" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">field</figcaption></figure>
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="corner" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">corner</figcaption></figure>
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="tile" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">tile</figcaption></figure>
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="close-up" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">close-up</figcaption></figure>
  <figure class="flex flex-col gap-2"><spyglass-brand-light variant="curved-strip" cover class="aspect-[4/3] w-full rounded-container"></spyglass-brand-light><figcaption class="type-label text-fg-muted">curved-strip</figcaption></figure>
  <figure class="flex flex-col gap-2">
    <div class="flex aspect-[4/3] w-full justify-between overflow-hidden rounded-container bg-surface">
      <spyglass-brand-light variant="strip-left" class="h-full"></spyglass-brand-light>
      <spyglass-brand-light variant="strip-right" class="h-full"></spyglass-brand-light>
    </div>
    <figcaption class="type-label text-fg-muted">strip-left, strip-right</figcaption>
  </figure>
</div>
