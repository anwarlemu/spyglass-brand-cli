<!-- A field with its button, and a stack of secondary buttons. -->
<div class="flex w-120 max-w-full flex-col items-center gap-6">
  <spyglass-button-group label="Invite" class="w-full">
    <spyglass-input aria-label="Email" placeholder="team@acme.com"></spyglass-input>
    <spyglass-button>Invite</spyglass-button>
  </spyglass-button-group>
  <spyglass-button-group label="Sort" vertical>
    <spyglass-button variant="secondary">Newest</spyglass-button>
    <spyglass-button variant="secondary">Longest running</spyglass-button>
    <spyglass-button variant="secondary">Most engagement</spyglass-button>
  </spyglass-button-group>
</div>
