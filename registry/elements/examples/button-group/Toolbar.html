<!-- A results toolbar: paging, the two views, and a save button with its menu arrow, each set joined into one block. -->
<div class="flex flex-wrap items-center justify-center gap-3">
  <spyglass-button-group label="Pages">
    <spyglass-button variant="secondary" icon aria-label="Previous page"><i data-lucide="chevron-left" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></spyglass-button>
    <spyglass-button variant="secondary" icon aria-label="Next page"><i data-lucide="chevron-right" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></spyglass-button>
  </spyglass-button-group>
  <spyglass-button-group label="View">
    <spyglass-button variant="secondary"><i data-lucide="layout-grid" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Grid</spyglass-button>
    <spyglass-button variant="secondary"><i data-lucide="rows-3" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Rows</spyglass-button>
  </spyglass-button-group>
  <spyglass-button-group label="Save">
    <spyglass-button variant="secondary">Save to board</spyglass-button>
    <spyglass-button variant="secondary" icon aria-label="Choose a board"><i data-lucide="chevron-down" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></spyglass-button>
  </spyglass-button-group>
</div>
