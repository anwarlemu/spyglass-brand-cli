<!-- A creative's tools as icon buttons, each named by its tooltip. Point at one and wait, then move along: the next
     shows at once. Tab to one and its name shows without a wait. -->
<div class="flex min-h-24 items-start justify-center gap-1">
  <spyglass-tooltip text="Save to board"><spyglass-button variant="ghost" icon aria-label="Save to board"><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5"></i></spyglass-button></spyglass-tooltip>
  <spyglass-tooltip text="Copy link"><spyglass-button variant="ghost" icon aria-label="Copy link"><i data-lucide="link" data-size="16" data-stroke-width="1.5"></i></spyglass-button></spyglass-tooltip>
  <spyglass-tooltip text="Download"><spyglass-button variant="ghost" icon aria-label="Download"><i data-lucide="download" data-size="16" data-stroke-width="1.5"></i></spyglass-button></spyglass-tooltip>
  <spyglass-tooltip text="Hide"><spyglass-button variant="ghost" icon aria-label="Hide"><i data-lucide="eye-off" data-size="16" data-stroke-width="1.5"></i></spyglass-button></spyglass-tooltip>
</div>
