<!-- A creative's actions, open with the page: save, copy, download, then report on its own. -->
<div class="flex h-72 w-full items-start justify-center pt-2">
  <spyglass-dropdown-menu label="Creative actions" open>
    <span slot="trigger" class="contents"><i data-lucide="ellipsis" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Actions</span>
    <spyglass-menu-label>Acme summer UGC</spyglass-menu-label>
    <spyglass-menu-item><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Save to board</spyglass-menu-item>
    <spyglass-menu-item><i data-lucide="link" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Copy link</spyglass-menu-item>
    <spyglass-menu-item><i data-lucide="download" data-size="16" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Download</spyglass-menu-item>
    <spyglass-menu-separator></spyglass-menu-separator>
    <spyglass-menu-item danger><i data-lucide="flag" data-size="16" data-stroke-width="1.5" class="shrink-0" aria-hidden="true"></i>Report</spyglass-menu-item>
  </spyglass-dropdown-menu>
</div>
