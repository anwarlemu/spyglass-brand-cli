<!-- Tracking a new brand: a name, its site and where it advertises. Send it empty to see the errors; a name of "Acme"
     shows the server's answer. -->
<div id="track-brand-form" class="w-100 max-w-full">
  <spyglass-form label="Track a brand">
    <spyglass-field label="Brand" description="The name as it shows on its ads.">
      <spyglass-input data-key="brand" autocomplete="off" placeholder="Acme Studio"></spyglass-input>
    </spyglass-field>
    <spyglass-field label="Site">
      <spyglass-input data-key="site" autocomplete="off" placeholder="acme.com"></spyglass-input>
    </spyglass-field>
    <spyglass-field label="Platform">
      <spyglass-native-select data-key="platform" value="meta"><option value="meta">Meta</option><option value="tiktok">TikTok</option><option value="all">Every platform</option></spyglass-native-select>
    </spyglass-field>
    <spyglass-button slot="actions" variant="ghost" data-clear>Clear</spyglass-button>
    <spyglass-button slot="actions" type="submit">Start tracking</spyglass-button>
  </spyglass-form>
  <template>
    <div class="flex flex-col items-start gap-4 rounded-container bg-surface-raised p-6" role="status">
      <p class="type-ui text-fg"></p>
      <spyglass-button variant="secondary">Track another</spyglass-button>
    </div>
  </template>
</div>
<script type="module">
  // useForm: an error shows once its field is left or the form sent, then follows the value.
  await customElements.whenDefined('spyglass-form')
  const root = document.getElementById('track-brand-form')
  const form = root.querySelector('spyglass-form')
  const template = root.querySelector('template')
  const submitButton = form.querySelector('[type="submit"]')
  const fields = Object.fromEntries([...form.querySelectorAll('[data-key]')].map((el) => [el.dataset.key, el]))
  const initial = { brand: '', site: '', platform: 'meta' }
  const rules = {
    brand: (v) => (!String(v).trim() ? 'Name the brand to track.' : undefined),
    site: (v) => (!String(v).trim() ? "Add the brand's site." : !/^[\w-]+(\.[\w-]+)+$/.test(String(v).trim()) ? 'Use a domain, such as acme.com.' : undefined),
  }
  let values = { ...initial }
  let touched = {}
  let tried = false
  let sending = false
  const all = () => Object.fromEntries(Object.entries(rules).map(([k, rule]) => [k, rule(values[k], values)]).filter(([, m]) => m))
  const paint = () => {
    const errors = all()
    for (const key of Object.keys(rules)) {
      const message = tried || touched[key] ? errors[key] : undefined
      fields[key].closest('spyglass-field').error = message
      fields[key].invalid = !!message
    }
    submitButton.disabled = sending
    // Only a changed label is written: replacing the text under a press would swallow its click.
    const label = sending ? 'Adding' : 'Start tracking'
    if (submitButton.textContent !== label) submitButton.textContent = label
  }
  for (const [key, el] of Object.entries(fields)) {
    el.addEventListener('input', () => { values = { ...values, [key]: el.value }; paint() })
    el.addEventListener('change', () => { values = { ...values, [key]: el.value }; paint() })
    el.addEventListener('focusout', () => { touched[key] = true; paint() })
  }
  const reset = () => {
    values = { ...initial }
    touched = {}
    tried = false
    form.failure = undefined
    fields.brand.value = ''
    fields.site.value = ''
    fields.platform.value = 'meta'
    paint()
  }
  form.querySelector('[data-clear]').addEventListener('click', reset)
  form.addEventListener('submit', async () => {
    tried = true
    form.failure = undefined
    paint()
    if (Object.keys(all()).length || sending) return
    sending = true
    paint()
    try {
      await new Promise((resolve) => setTimeout(resolve, 600))
      if (values.brand.trim().toLowerCase() === 'acme') throw new Error('Acme is already on your list.')
      const done = template.content.firstElementChild.cloneNode(true)
      done.querySelector('p').textContent = `Tracking ${values.brand.trim()}. New ads show up within a day.`
      done.querySelector('spyglass-button').addEventListener('click', () => {
        done.replaceWith(form)
        reset()
      })
      form.replaceWith(done)
    } catch (error) {
      form.failure = error.message
    } finally {
      sending = false
      paint()
    }
  })
  paint()
</script>
