<!-- Labels over the fields they name, one with a note that it can stay empty. -->
<div class="flex w-80 max-w-full flex-col gap-6">
  <div class="flex flex-col gap-2">
    <spyglass-label for="label-email">Work email</spyglass-label>
    <spyglass-input id="label-email" type="email" placeholder="you@acme.com"></spyglass-input>
  </div>
  <div class="flex flex-col gap-2">
    <spyglass-label for="label-team" hint="Optional">Team name</spyglass-label>
    <spyglass-input id="label-team" placeholder="Acme growth"></spyglass-input>
  </div>
</div>
