<!-- Filters over a grid of creatives: each stays on until pressed again. -->
<div class="flex flex-wrap items-center gap-2">
  <spyglass-toggle pressed><i data-lucide="play" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Video</spyglass-toggle>
  <spyglass-toggle><i data-lucide="grid-2x2" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i>Carousel</spyglass-toggle>
  <spyglass-toggle variant="outline" icon aria-label="Saved only"><i data-lucide="bookmark" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></spyglass-toggle>
  <spyglass-toggle variant="outline" disabled>UGC</spyglass-toggle>
</div>
