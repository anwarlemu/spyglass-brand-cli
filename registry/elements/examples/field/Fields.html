<!-- A field with a line of help under it, and one that says what is wrong. -->
<div class="flex w-80 max-w-full flex-col gap-6">
  <spyglass-field label="Brand or creator" description="Add any brand or creator in under a minute.">
    <spyglass-input name="brand" placeholder="Acme"></spyglass-input>
  </spyglass-field>
  <spyglass-field label="Work email" error="Use your work email, such as you@acme.com.">
    <spyglass-input name="email" type="email" value="acme"></spyglass-input>
  </spyglass-field>
</div>
