<!-- The four variants, and the dots a creative's status takes. -->
<div class="flex flex-col items-center gap-4">
  <div class="flex flex-wrap items-center justify-center gap-2">
    <spyglass-badge>New</spyglass-badge>
    <spyglass-badge variant="secondary">Video</spyglass-badge>
    <spyglass-badge variant="outline">Carousel</spyglass-badge>
    <spyglass-badge variant="destructive">Paused</spyglass-badge>
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2">
    <spyglass-badge variant="outline" dot="green">Running</spyglass-badge>
    <spyglass-badge variant="outline" dot="yellow">Testing</spyglass-badge>
    <spyglass-badge variant="outline" dot="red">Ended</spyglass-badge>
  </div>
</div>
