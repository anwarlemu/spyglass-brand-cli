<!-- A note that is too long, with the message that says so. -->
<div class="flex w-96 max-w-full flex-col gap-2">
  <label for="textarea-note" class="type-label text-fg-soft">Note</label>
  <spyglass-textarea id="textarea-note" name="note" rows="3" invalid aria-label="Note" aria-description="Keep the note under 80 characters." value="Every Acme ad from the last year that opens on a face, a product shot or a number, sorted by spend."></spyglass-textarea>
  <p id="textarea-note-error" class="type-caption text-fg-danger">Keep the note under 80 characters.</p>
</div>
