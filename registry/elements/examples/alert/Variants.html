<!-- A note with the action that goes with it, and a problem in red with the fix. -->
<div class="flex w-160 max-w-full flex-col gap-3">
  <spyglass-alert alert-role="status" heading="Your first month is $10.">
    <i data-lucide="info" data-size="16" data-stroke-width="1.5" slot="icon"></i>
    Then $20/month. Cancel any time.
    <spyglass-button slot="action" size="sm">Start Creator</spyglass-button>
  </spyglass-alert>
  <spyglass-alert variant="destructive" heading="Your payment did not go through.">
    <i data-lucide="circle-alert" data-size="16" data-stroke-width="1.5" slot="icon"></i>
    Update your card to keep Acme's boards.
    <spyglass-button slot="action" size="sm" variant="secondary">Update card</spyglass-button>
  </spyglass-alert>
  <spyglass-alert alert-role="status" heading="Search results update every day.">
    <i data-lucide="info" data-size="16" data-stroke-width="1.5" slot="icon"></i>
  </spyglass-alert>
</div>
