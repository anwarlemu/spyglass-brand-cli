colour split. On touch, narrow screens and with reduced motion it stays the picture. -->

  <spyglass-light-image art="pricing" class="absolute top-0 left-1/2 aspect-[2640/1400] w-[980px] -translate-x-1/2 [mask-image:linear-gradient(to_right,transparent,var(--ds-color-black)_40%)]"></spyglass-light-image>
</section>
