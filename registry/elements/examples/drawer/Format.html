<!-- A choice on a phone, from the bottom edge: which format to search. The rows are 44px to land a thumb on. -->
<div class="flex min-h-72 items-center justify-center">
  <spyglass-button id="format-open" variant="secondary"><i data-lucide="sliders-horizontal" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i><span id="format-current">All formats</span></spyglass-button>
  <spyglass-drawer id="format-drawer" heading="Format" description="Search one format, or all of them.">
    <ul class="flex flex-col gap-1">
      <li><button type="button" aria-pressed="true" data-autofocus data-format="All formats" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">All formats</span><span data-check class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-format="Video" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Video</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-format="Image" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Image</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-format="Carousel" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">Carousel</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
      <li><button type="button" aria-pressed="false" data-format="UGC" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-ds-sm px-3 text-left type-body text-fg outline-none transition-[background-color] duration-150 ease-standard hover:bg-ds-neutral-4 focus-visible:bg-ds-neutral-4"><span class="min-w-0 flex-1">UGC</span><span data-check hidden class="contents"><i data-lucide="check" data-size="16" data-stroke-width="1.5" aria-hidden="true"></i></span></button></li>
    </ul>
  </spyglass-drawer>
</div>
<script type="module">
  const drawer = document.getElementById('format-drawer')
  document.getElementById('format-open').addEventListener('click', () => { drawer.open = true })
  for (const b of drawer.querySelectorAll('[data-format]')) {
    b.addEventListener('click', () => {
      for (const o of drawer.querySelectorAll('[data-format]')) {
        const on = o === b
        o.setAttribute('aria-pressed', String(on))
        o.toggleAttribute('data-autofocus', on)
        o.querySelector('[data-check]').hidden = !on
      }
      document.getElementById('format-current').textContent = b.dataset.format
      drawer.close()
    })
  }
</script>
