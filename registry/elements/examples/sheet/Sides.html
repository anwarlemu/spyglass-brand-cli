<!-- The four edges a sheet comes from: right and left for details beside the page, top and bottom for a short row. -->
<div class="flex min-h-40 flex-wrap items-center justify-center gap-2">
  <spyglass-button variant="secondary" data-side="top">Top</spyglass-button>
  <spyglass-button variant="secondary" data-side="right">Right</spyglass-button>
  <spyglass-button variant="secondary" data-side="bottom">Bottom</spyglass-button>
  <spyglass-button variant="secondary" data-side="left">Left</spyglass-button>
  <spyglass-sheet side="top" heading="Acme Studio" description="128 active ads on Meta and TikTok, 14 new this week."><p class="type-ui text-fg-soft">Save the brand to a board to follow every new ad it launches.</p></spyglass-sheet>
  <spyglass-sheet side="right" heading="Acme Studio" description="128 active ads on Meta and TikTok, 14 new this week."><p class="type-ui text-fg-soft">Save the brand to a board to follow every new ad it launches.</p></spyglass-sheet>
  <spyglass-sheet side="bottom" heading="Acme Studio" description="128 active ads on Meta and TikTok, 14 new this week."><p class="type-ui text-fg-soft">Save the brand to a board to follow every new ad it launches.</p></spyglass-sheet>
  <spyglass-sheet side="left" heading="Acme Studio" description="128 active ads on Meta and TikTok, 14 new this week."><p class="type-ui text-fg-soft">Save the brand to a board to follow every new ad it launches.</p></spyglass-sheet>
</div>
<script type="module">
  for (const b of document.querySelectorAll('spyglass-button[data-side]')) {
    b.addEventListener('click', () => { document.querySelector(`spyglass-sheet[side="${b.dataset.side}"]`).open = true })
  }
</script>
