<!-- The lens over a section's drifts: move a mouse near them (768 wide and up) and more characters gather by the pointer. -->
<section class="relative isolate flex h-96 flex-col items-center justify-center gap-4 overflow-clip bg-surface px-6 text-center">
  <spyglass-ascii-lens></spyglass-ascii-lens>
  <spyglass-ascii-drift crop="mass" from="left" class="top-0 left-0 h-full w-[45%]"></spyglass-ascii-drift>
  <spyglass-ascii-drift crop="scatter" from="right" class="top-0 right-0 h-full w-[45%]"></spyglass-ascii-drift>
  <h2 class="type-heading-2 text-fg">Point at the texture.</h2>
</section>
