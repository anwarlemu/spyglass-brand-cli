<!-- The shortcuts beside what they do, and a key inside a sentence. -->
<div class="flex w-72 max-w-full flex-col gap-6">
  <dl class="flex flex-col gap-3">
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Search creatives</dt>
      <dd><spyglass-kbd-group><spyglass-kbd>⌘</spyglass-kbd><spyglass-kbd>K</spyglass-kbd></spyglass-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Save to a board</dt>
      <dd><spyglass-kbd-group><spyglass-kbd>⌘</spyglass-kbd><spyglass-kbd>S</spyglass-kbd></spyglass-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Next result</dt>
      <dd><spyglass-kbd-group><spyglass-kbd>J</spyglass-kbd></spyglass-kbd-group></dd>
    </div>
    <div class="flex items-center justify-between gap-4">
      <dt class="type-ui text-fg-soft">Previous result</dt>
      <dd><spyglass-kbd-group><spyglass-kbd>K</spyglass-kbd></spyglass-kbd-group></dd>
    </div>
  </dl>
  <p class="type-caption text-fg-muted">Press <spyglass-kbd>Esc</spyglass-kbd> to close any panel.</p>
</div>
