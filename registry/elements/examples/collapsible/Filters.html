<!-- More filters, tucked under the search until a person asks for them. -->
<div class="w-100 max-w-full rounded-container bg-surface-raised px-4 py-2">
  <spyglass-collapsible>
    <span slot="trigger" class="contents">More filters</span>
    <div class="flex flex-col pb-2">
      <spyglass-checkbox label="Still running" checked></spyglass-checkbox>
      <spyglass-checkbox label="Has a voiceover"></spyglass-checkbox>
      <spyglass-checkbox label="Under 30 seconds"></spyglass-checkbox>
    </div>
  </spyglass-collapsible>
</div>
