<!-- An icon, a prefix, a unit and a button, each inside the field's hairline. -->
<div class="flex w-96 max-w-full flex-col gap-4">
  <spyglass-input-group aria-label="Search boards" placeholder="Search boards"><i data-lucide="search" data-size="16" data-stroke-width="1.5" slot="start" aria-hidden="true"></i></spyglass-input-group>
  <spyglass-input-group aria-label="Board link" value="acme-hooks"><span slot="start">spyglass.so/b/</span></spyglass-input-group>
  <spyglass-input-group aria-label="Monthly budget" type="number" value="20"><span slot="start">$</span><span slot="end">per month</span></spyglass-input-group>
  <spyglass-input-group aria-label="Invite by email" type="email" placeholder="name@acme.com"><spyglass-button slot="end" variant="secondary" size="sm">Invite</spyglass-button></spyglass-input-group>
</div>
