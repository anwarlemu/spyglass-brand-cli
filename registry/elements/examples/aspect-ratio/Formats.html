<!-- The brand's three canvases holding their shape at any width: a 1:1 post, a 4:5 ad and a 16:9 slide, each with the
     light behind its label. -->
<div class="grid w-200 max-w-full grid-cols-3 items-end gap-4 max-sm:grid-cols-1">
  <spyglass-aspect-ratio ratio="1" class="rounded-container bg-surface-raised">
    <spyglass-brand-light variant="corner" seed="1" cover class="absolute inset-0"></spyglass-brand-light>
    <span class="absolute bottom-3 left-3 type-label text-fg">Post 1:1</span>
  </spyglass-aspect-ratio>
  <spyglass-aspect-ratio ratio="0.8" class="rounded-container bg-surface-raised">
    <spyglass-brand-light variant="strip-left" seed="1" cover class="absolute inset-0"></spyglass-brand-light>
    <span class="absolute bottom-3 left-3 type-label text-fg">Ad 4:5</span>
  </spyglass-aspect-ratio>
  <spyglass-aspect-ratio ratio="1.7777777777777777" class="rounded-container bg-surface-raised">
    <spyglass-brand-light variant="field" seed="1" cover class="absolute inset-0"></spyglass-brand-light>
    <span class="absolute bottom-3 left-3 type-label text-fg">Slide 16:9</span>
  </spyglass-aspect-ratio>
</div>
